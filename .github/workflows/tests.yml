name: Tests

on:
    pull_request:
    push:
        branches: [ main ]

jobs:
    test:
        runs-on: ubuntu-latest

        services:
            postgres:
                image: postgres:14
                env:
                    POSTGRES_USER: postgres
                    POSTGRES_PASSWORD: postgres
                    POSTGRES_DB: condo
                ports:
                    - 5432:5432
                options: >-
                    --health-cmd="pg_isready"
                    --health-interval=10s
                    --health-timeout=5s
                    --health-retries=5

        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-node@v4
              with:
                  node-version: 18
                  cache: 'yarn'

            - name: Install deps
              run: yarn install --frozen-lockfile

            - name: Run migrations
              run: yarn workspace @open-condo/keystone migrate
              env:
                  DATABASE_URL: postgres://postgres:postgres@localhost:5432/condo

            - name: Run tests
              run: yarn test
